<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found | Barkhaus</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0F1C26; --surface:#1A3044; --border:rgba(77,150,185,0.30);
      --cream:#F0EDE6; --cream-m:#B8D4E0; --blue:#4D96B9; --yellow:#FFCE58;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { min-height:100%; }
    body {
      background:var(--bg); color:var(--cream);
      font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      display:flex; align-items:center; justify-content:center; min-height:100vh; padding:32px 16px;
    }
    main { max-width:440px; text-align:center; }
    .logo { width:180px; max-width:60%; height:auto; margin-bottom:32px; }
    .eyebrow { font-size:11px; font-weight:800; letter-spacing:0.22em; text-transform:uppercase; color:var(--yellow); margin-bottom:12px; }
    h1 { font-size:clamp(26px,6vw,36px); font-weight:900; line-height:1.15; margin-bottom:12px; }
    p { font-size:15px; line-height:1.7; color:var(--cream-m); margin-bottom:28px; }
    .actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    .btn { display:inline-block; padding:12px 22px; border-radius:999px; font-weight:800; font-size:14px; text-decoration:none; }
    .btn-primary { background:var(--yellow); color:var(--bg); }
    .btn-secondary { border:1px solid var(--border); color:var(--cream); background:var(--surface); }
    .btn:focus-visible { outline:2px solid var(--blue); outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <a href="/"><img class="logo" src="/images/Barkhaus%20Logo%20Horizontal.png" alt="Barkhaus"></a>
    <div class="eyebrow">Error 404</div>
    <h1>This page wandered off.</h1>
    <p>We couldn't find the page you were looking for. It may have moved, or the link may be mistyped.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/booking">Book a stay</a>
      <a class="btn btn-secondary" href="/">Back to home</a>
    </div>
  </main>
</body>
</html>
